<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testing - Modified</title>
    <style>
        .Container {
            width:100%;
        }
        .Card{
            display: inline-block;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            padding: 20px;
            width: 400px;
            height: 100;
        }
        .Card-Header {
            background-color: teal;
            text-align: center;
            border-top-left-radius: 5px;
            border-top-right-radius: 5px;
            border-bottom-left-radius: 5px;
            border-bottom-right-radius: 5px;
            height:100px;
        }
        .Card-Body {
            background-color: paleturquoise;
            border-top-left-radius: 5px;
            border-top-right-radius: 5px;
            height:300px;
            text-align: center;
        }
        .Card-Footer {
            background-color: aquamarine;
            border-bottom-left-radius: 5px;
            border-bottom-right-radius: 5px;
            height:50px;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="Card">
        <div class="Card-Header">
            <h2>Card Title</h2>
        </div>
        <div class="Card-Body">
            <p>Card Content</p>
        </div>
        <div class="Card-Footer">
            <h5>Testing Card Footer</h5>
        </div>
    </div>

</body>
</html>
